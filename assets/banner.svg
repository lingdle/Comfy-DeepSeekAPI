<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 540" width="1260" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16305c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9dff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1260" height="540" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="200" fill="url(#accent)" opacity="0.10"/>
  <circle cx="120" cy="470" r="180" fill="url(#accent)" opacity="0.08"/>

  <text x="100" y="196" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="58" font-weight="800" fill="#eaf2ff">DeepSeek API for ComfyUI</text>
  <text x="102" y="250" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="24" fill="#9fc4ff">一个插件，三个节点 · One plugin, three nodes</text>

  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="100" y="300" width="340" height="86" rx="18" fill="#12233f" stroke="#2f4c7d"/>
    <text x="270" y="338" font-size="24" font-weight="700" fill="#dbe9ff">模型 API</text>
    <text x="270" y="366" font-size="16" fill="#8fb2e6">Model · text + images</text>

    <rect x="460" y="300" width="340" height="86" rx="18" fill="#12233f" stroke="#2f4c7d"/>
    <text x="630" y="338" font-size="24" font-weight="700" fill="#dbe9ff">搜索 API</text>
    <text x="630" y="366" font-size="16" fill="#8fb2e6">Search · web results</text>

    <rect x="820" y="300" width="340" height="86" rx="18" fill="#12233f" stroke="#2f4c7d"/>
    <text x="990" y="338" font-size="24" font-weight="700" fill="#dbe9ff">额度 API</text>
    <text x="990" y="366" font-size="16" fill="#8fb2e6">Balance · account</text>
  </g>

  <text x="102" y="444" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="19" fill="#6f8dbb">deepseek-flash · 支持联网工具 / web tools · 内置用量与费用估算 / usage &amp; cost</text>
  <text x="102" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="15" fill="#4a678f">github.com/lingdle/Comfy-DeepSeekAPI</text>
</svg>
